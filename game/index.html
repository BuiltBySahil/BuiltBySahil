<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BuiltBySahil - Contribution Rocket</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="game">
    <div class="header">
      <h1>🚀 Contribution Rocket</h1>
      <p>BuiltBySahil GitHub Activity</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="stats">
      <span>💥 Hits: <strong id="hits">0</strong></span>
      <span>📅 Target: <strong id="targetDate">Waiting...</strong></span>
      <span>🔥 Power: <strong id="power">0</strong></span>
    </div>

    <button id="startButton">
      🚀 START BATTLE
    </button>
  </main>

  <script src="game.js"></script>

</body>
</html>
