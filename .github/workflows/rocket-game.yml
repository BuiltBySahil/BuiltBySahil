name: Generate contribution rocket game

on:
  schedule:
    - cron: "0 0 * * *" # once a day, midnight UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        env:
          GITHUB_LOGIN: BuiltBySahil
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-rocket-game.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add game/contribution-rocket.svg

          if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
          fi

          git commit -m "chore: update contribution rocket game"

          git fetch origin main
          git rebase origin/main

          git push origin main
